<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #container{
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="./monaco-editor/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: './monaco-editor/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('container'), {
                language: 'c',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        function setCode(code) { window.editor.setValue(code); }
        function getCode() { return window.editor.getValue(); }
        window.DoSomething = function () { return "Hello World" }
    </script>
</body>
</html>
